<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Home screen app on phones and tablets (opened over the network, see main/webServer.ts) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#262626" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Filmster" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- ws: is for Vite HMR in dev; posters come from poster://, videos from media://, search results load posters from https: -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: poster:; media-src 'self' blob: media:; font-src 'self' data:; connect-src 'self' ws:" />
  </head>
  <body class="bg-neutral-900 text-neutral-500">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
